<!-- Bible Study App - Version 1.0.2 (Build: 2024-05-22) -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Interpreter - 영어성경 통역 훈련</title>
    
    <!-- 라이브러리 (버전 고정 및 안정성 확보) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif:italic,wght@0,400;0,700;1,400&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
        }
        
        .font-serif { font-family: 'Noto Serif', serif; }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 로딩 화면 스타일 */
        #root:empty::before {
            content: "영성 공부 앱을 불러오는 중입니다... (1분 이상 지속되면 새로고침 해주세요)";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
            color: #64748b;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 데이터 영역 (6개 구절) ---
        const BIBLE_DATA = [
            { id: 1, theme: "용기", reference: "Joshua 1:9", eng_target: "Have I not commanded you? Be strong and courageous.", kor_structure: "내가 너에게 명령하지 않았느냐? / 강하고 담대하라.", kor_natural: "내가 네게 명령한 것이 아니냐 강하고 담대하라.", grammar_tip: "Have I not ~?는 강한 강조를 나타내는 수사 의문문입니다.", words_hint: "command(명령하다), courageous(담대한)", level: 1 },
            { id: 2, theme: "위로", reference: "Matthew 11:28", eng_target: "Come to me, all you who are weary and burdened, and I will give you rest.", kor_structure: "나에게로 오라 / 너희 모든 수고하고 무거운 짐 진 자들아 / 그러면 내가 너희에게 안식을 주리라.", kor_natural: "수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라.", grammar_tip: "all you who ~는 '~하는 너희들 모두'라는 수식 구조입니다.", words_hint: "weary(지친), burdened(짐 지운), rest(안식)", level: 2 },
            { id: 3, theme: "믿음", reference: "Hebrews 11:1", eng_target: "Now faith is confidence in what we hope for and assurance about what we do not see.", kor_structure: "이제 믿음은 확신이다 / 우리가 바라는 것들에 대한 / 그리고 확증이다 / 우리가 보지 못하는 것들에 대한.", kor_natural: "믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니.", grammar_tip: "what we hope for는 '우리가 바라는 것'이라는 관계대명사절입니다.", words_hint: "confidence(확신), assurance(확증)", level: 3 },
            { id: 4, theme: "사랑", reference: "1 Corinthians 13:4", eng_target: "Love is patient, love is kind. It does not envy, it does not boast, it is not proud.", kor_structure: "사랑은 오래 참고 / 사랑은 온유하며 / 시기하지 아니하며 / 자랑하지 아니하며 / 교만하지 아니한다.", kor_natural: "사랑은 언제나 오래 참고 사랑은 온유하며 시기하지 아니하며...", grammar_tip: "주어+be동사+형용사 구조의 반복입니다.", words_hint: "patient(참을성 있는), envy(시기하다), boast(자랑하다)", level: 2 },
            { id: 5, theme: "비전", reference: "Jeremiah 29:11", eng_target: "For I know the plans I have for you, declares the Lord, plans to prosper you and not to harm you.", kor_structure: "왜냐하면 내가 그 계획들을 알기 때문이다 / 내가 너희를 위해 가진 / 여호와께서 말씀하신다 / 너희를 번성하게 하려는 계획이요 / 재앙을 주려는 것이 아니다.", kor_natural: "여호와의 말씀이니라 너희를 향한 나의 생각을 내가 아나니 평안이요 재앙이 아니니라.", grammar_tip: "plans 뒤의 I have for you는 수식 구조입니다.", words_hint: "declare(선포하다), prosper(번영하다), harm(해치다)", level: 3 },
            { id: 6, theme: "지혜", reference: "James 1:5", eng_target: "If any of you lacks wisdom, you should ask God, who gives generously to all.", kor_structure: "만약 너희 중 누구라도 지혜가 부족하다면 / 하나님께 구해야 한다 / 모든 사람에게 후히 주시는 (하나님께).", kor_natural: "너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고...", grammar_tip: "관계대명사 who의 계속적 용법이 쓰였습니다.", words_hint: "lack(부족하다), wisdom(지혜), generously(관대하게)", level: 2 }
        ];

        // --- 아이콘 수동 정의 ---
        const Icon = ({name}) => {
            const icons = {
                Home: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
                BookOpen: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
                Speaker: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
                ChevronRight: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
                Check: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
                Refresh: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            };
            return icons[name] || <span>•</span>;
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('list');
            const [selectedItem, setSelectedItem] = useState(null);
            const [studyStep, setStudyStep] = useState(1);
            const [userInput, setUserInput] = useState('');
            const [completedCount, setCompletedCount] = useState(0);

            const handleSpeak = (text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            };

            const compareText = (original, input) => {
                const clean = (str) => str ? str.replace(/[.,?!]/g, '').toLowerCase().trim() : '';
                const origWords = clean(original).split(/\s+/);
                const inputWords = clean(input).split(/\s+/);
                const originalDisplayWords = original.split(/\s+/);
                const inputDisplayWords = input.split(/\s+/);
                
                return originalDisplayWords.map((word, i) => {
                    const isCorrect = clean(word) === clean(inputWords[i] || '');
                    return { origWord: word, userWord: inputDisplayWords[i] || '____', isCorrect };
                });
            };

            if (currentView === 'list') {
                return (
                    <div className="min-h-screen p-6 md:p-12 fade-in">
                        <div className="max-w-5xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                                <div>
                                    <h1 className="text-4xl font-black text-slate-900 mb-2 tracking-tighter italic">Bible Translation</h1>
                                    <p className="text-slate-500 font-medium tracking-tight">영어 성경을 통역사처럼 공부하기</p>
                                </div>
                                <div className="bg-white px-6 py-4 rounded-2xl shadow-sm border border-slate-200">
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Completed</p>
                                    <p className="text-xl font-bold text-slate-800">{completedCount} Verses</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {BIBLE_DATA.map((item) => (
                                    <div key={item.id} onClick={() => { setSelectedItem(item); setCurrentView('study'); setStudyStep(1); setUserInput(''); }} className="bg-white p-7 rounded-3xl border border-slate-200 shadow-sm hover:shadow-2xl hover:border-blue-400 transition-all cursor-pointer flex flex-col justify-between">
                                        <div>
                                            <div className="flex justify-between items-center mb-6 text-[10px] font-bold uppercase tracking-widest">
                                                <span className="text-slate-400">Level {item.level}</span>
                                                <span className="text-blue-500">{item.theme}</span>
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-800 mb-3">{item.reference}</h3>
                                            <p className="text-slate-500 text-sm leading-relaxed line-clamp-3 italic">"{item.kor_natural}"</p>
                                        </div>
                                        <div className="mt-8 pt-6 border-t border-slate-50 flex justify-between items-center text-blue-600 text-xs font-black">
                                            Start Training <Icon name="ChevronRight" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (currentView === 'study') {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-0 md:p-8 fade-in">
                        <div className="max-w-4xl w-full bg-white md:rounded-[40px] shadow-2xl overflow-hidden min-h-[600px] flex flex-col">
                            <div className="bg-white border-b border-slate-100 p-6 flex justify-between items-center">
                                <button onClick={() => { window.speechSynthesis.cancel(); setCurrentView('list'); }} className="p-3 hover:bg-slate-50 rounded-2xl transition">
                                    <Icon name="Home" />
                                </button>
                                <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">{selectedItem.reference}</div>
                            </div>
                            <div className="p-8 md:p-14 flex-grow flex flex-col">
                                {studyStep === 1 && (
                                    <div className="space-y-10 flex-grow fade-in">
                                        <div className="space-y-4">
                                            <h2 className="text-3xl font-black text-slate-900">Step 1. 구조 파악</h2>
                                            <p className="text-slate-500 text-lg font-medium">원문의 소리와 영어식 어순을 매칭하세요.</p>
                                        </div>
                                        <div className="space-y-6">
                                            <div className="bg-slate-900 p-8 rounded-[32px] shadow-xl relative">
                                                <p className="text-2xl md:text-3xl font-serif text-white italic leading-tight pr-16">"{selectedItem.eng_target}"</p>
                                                <button onClick={() => handleSpeak(selectedItem.eng_target)} className="absolute right-6 top-1/2 -translate-y-1/2 bg-blue-600 text-white p-5 rounded-3xl hover:bg-blue-500 active:scale-95"><Icon name="Speaker" /></button>
                                            </div>
                                            <div className="bg-blue-50 p-8 rounded-[32px] border border-blue-100">
                                                <p className="text-xl md:text-2xl text-slate-800 font-bold leading-relaxed">{selectedItem.kor_structure}</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setStudyStep(2)} className="mt-auto w-full bg-slate-900 text-white py-6 rounded-3xl font-black text-xl hover:bg-blue-600 transition-all flex items-center justify-center gap-3 active:scale-95">영작 도전하기</button>
                                    </div>
                                )}
                                {studyStep === 2 && (
                                    <div className="space-y-8 flex-grow fade-in">
                                        <div className="space-y-2">
                                            <h2 className="text-3xl font-black text-slate-900">Step 2. 직접 영작</h2>
                                            <p className="text-slate-500 text-lg font-medium">제시된 어순에 맞춰 영어 문장을 입력하세요.</p>
                                        </div>
                                        <div className="bg-slate-100 p-8 rounded-[32px] border-2 border-dashed border-slate-300">
                                            <p className="text-xl md:text-2xl text-slate-800 font-bold leading-relaxed">{selectedItem.kor_structure}</p>
                                        </div>
                                        <textarea autoFocus className="w-full h-48 p-8 border-2 border-slate-100 rounded-[32px] outline-none focus:border-blue-500 text-2xl font-serif bg-slate-50 shadow-inner" placeholder="Type here..." value={userInput} onChange={(e) => setUserInput(e.target.value)} />
                                        <div className="flex gap-4 mt-auto">
                                            <button onClick={() => setStudyStep(1)} className="flex-1 py-5 text-slate-400 font-bold border-2 border-slate-100 rounded-3xl">Back</button>
                                            <button onClick={() => setStudyStep(3)} disabled={!userInput.trim()} className="flex-[2] bg-blue-600 text-white py-5 rounded-3xl font-black text-xl shadow-xl active:scale-95 disabled:opacity-30">정답 확인</button>
                                        </div>
                                    </div>
                                )}
                                {studyStep === 3 && (
                                    <div className="space-y-10 flex-grow fade-in">
                                        <div className="space-y-2 text-center md:text-left">
                                            <h2 className="text-3xl font-black text-slate-900">Step 3. 분석 결과</h2>
                                        </div>
                                        <div className="grid gap-6">
                                            <div className="bg-slate-900 p-8 rounded-[40px] shadow-2xl relative overflow-hidden">
                                                <div className="absolute top-0 left-0 w-2 h-full bg-red-500"></div>
                                                <div className="flex flex-wrap gap-x-4 gap-y-3 font-serif text-xl md:text-2xl text-white">
                                                    {compareText(selectedItem.eng_target, userInput).map((res, i) => (
                                                        <div key={i} className="flex flex-col items-center">
                                                            <span className={res.isCorrect ? "opacity-90" : "text-red-500 font-black"}>{res.userWord}</span>
                                                            {!res.isCorrect && <span className="text-[10px] text-slate-400 font-sans uppercase mt-1">Correct: {res.origWord}</span>}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="bg-blue-50 p-8 rounded-[40px] relative">
                                                <p className="text-2xl md:text-3xl font-serif text-slate-900 leading-snug italic font-medium pr-16">"{selectedItem.eng_target}"</p>
                                                <button onClick={() => handleSpeak(selectedItem.eng_target)} className="absolute right-8 top-1/2 -translate-y-1/2 bg-white text-blue-600 p-4 rounded-3xl shadow-lg hover:bg-blue-600 hover:text-white transition-all"><Icon name="Speaker" /></button>
                                            </div>
                                        </div>
                                        <div className="flex gap-4 mt-auto">
                                            <button onClick={() => { setStudyStep(2); setUserInput(''); }} className="flex-1 py-5 text-blue-600 font-black border-2 border-blue-50 rounded-3xl flex items-center justify-center gap-2"><Icon name="Refresh" /> Retry</button>
                                            <button onClick={() => { setCompletedCount(prev => prev + 1); setCurrentView('list'); }} className="flex-[2] bg-slate-900 text-white py-5 rounded-3xl font-black text-xl shadow-xl">완료</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
