<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Interpreter - 영어성경 통역 훈련</title>
    
    <!-- 필수 라이브러리 (속도와 안정성을 위해 고정 버전 사용) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif:italic,wght@0,400;0,700;1,400&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }
        
        .font-serif { font-family: 'Noto Serif', serif; }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 앱 로딩 중 표시될 스타일 */
        #root:empty::before {
            content: "영성 공부를 위한 앱을 준비하고 있습니다...";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #64748b;
            font-weight: 700;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // 아이콘 컴포넌트 안전하게 가져오기
        const { 
            BookOpen, Edit3, CheckCircle, RefreshCcw, ExternalLink, 
            ChevronRight, AlertCircle, Home, Volume2, Lightbulb, BarChart3 
        } = LucideReact;

        const BIBLE_DATA = [
            {
                id: 1, theme: "용기", reference: "Joshua 1:9",
                eng_target: "Have I not commanded you? Be strong and courageous.",
                kor_structure: "내가 너에게 명령하지 않았느냐? / 강하고 담대하라.",
                kor_natural: "내가 네게 명령한 것이 아니냐 강하고 담대하라.",
                grammar_tip: "Have I not ~?는 강한 강조를 나타내는 수사 의문문입니다. Be + 형용사는 명령문을 만듭니다.",
                words_hint: "command(명령하다), courageous(담대한)", level: 1
            },
            {
                id: 2, theme: "위로", reference: "Matthew 11:28",
                eng_target: "Come to me, all you who are weary and burdened, and I will give you rest.",
                kor_structure: "나에게로 오라 / 너희 모든 수고하고 무거운 짐 진 자들아 / 그러면 내가 너희에게 안식을 주리라.",
                kor_natural: "수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라.",
                grammar_tip: "all you who ~는 '~하는 너희들 모두'라는 수식 구조입니다. and는 명령문 뒤에서 '그러면'으로 해석됩니다.",
                words_hint: "weary(지친), burdened(짐 지운), rest(안식)", level: 2
            },
            {
                id: 3, theme: "믿음", reference: "Hebrews 11:1",
                eng_target: "Now faith is confidence in what we hope for and assurance about what we do not see.",
                kor_structure: "이제 믿음은 확신이다 / 우리가 바라는 것들에 대한 / 그리고 확증이다 / 우리가 보지 못하는 것들에 대한.",
                kor_natural: "믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니.",
                grammar_tip: "what we hope for는 '우리가 바라는 것'이라는 목적격 관계대명사절입니다.",
                words_hint: "confidence(확신), assurance(확증)", level: 3
            },
            {
                id: 4, theme: "사랑", reference: "1 Corinthians 13:4",
                eng_target: "Love is patient, love is kind. It does not envy, it does not boast, it is not proud.",
                kor_structure: "사랑은 오래 참고 / 사랑은 온유하며 / 시기하지 아니하며 / 자랑하지 아니하며 / 교만하지 아니한다.",
                kor_natural: "사랑은 언제나 오래 참고 사랑은 온유하며 시기하지 아니하며...",
                grammar_tip: "주어 + be동사 + 형용사 구조의 반복을 통해 사랑의 속성을 설명합니다.",
                words_hint: "patient(참을성 있는), envy(시기하다), boast(자랑하다)", level: 2
            },
            {
                id: 5, theme: "비전", reference: "Jeremiah 29:11",
                eng_target: "For I know the plans I have for you, declares the Lord, plans to prosper you and not to harm you.",
                kor_structure: "왜냐하면 내가 그 계획들을 알기 때문이다 / 내가 너희를 위해 가진 / 여호와께서 말씀하신다 / 너희를 번성하게 하려는 계획이요 / 재앙을 주려는 것이 아니다.",
                kor_natural: "여호와의 말씀이니라 너희를 향한 나의 생각을 내가 아나니 평안이요 재앙이 아니니라.",
                grammar_tip: "plans 뒤의 I have for you는 목적격 관계대명사가 생략된 수식 구조입니다.",
                words_hint: "declare(선포하다), prosper(번영하다), harm(해치다)", level: 3
            },
            {
                id: 6, theme: "지혜", reference: "James 1:5",
                eng_target: "If any of you lacks wisdom, you should ask God, who gives generously to all.",
                kor_structure: "만약 너희 중 누구라도 지혜가 부족하다면 / 하나님께 구해야 한다 / 모든 사람에게 후히 주시는 (하나님께).",
                kor_natural: "너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고...",
                grammar_tip: "If 조건절과 함께 God을 보충 설명하는 관계대명사 who의 계속적 용법이 쓰였습니다.",
                words_hint: "lack(부족하다), wisdom(지혜), generously(관대하게)", level: 2
            }
        ];

        const App = () => {
            const [currentView, setCurrentView] = useState('list');
            const [selectedItem, setSelectedItem] = useState(null);
            const [studyStep, setStudyStep] = useState(1);
            const [userInput, setUserInput] = useState('');
            const [showHint, setShowHint] = useState(false);
            const [completedCount, setCompletedCount] = useState(0);

            const handleSpeak = (text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            };

            const compareText = (original, input) => {
                const clean = (str) => str ? str.replace(/[.,?!]/g, '').toLowerCase().trim() : '';
                const origWords = clean(original).split(/\s+/);
                const inputWords = clean(input).split(/\s+/);
                const originalDisplayWords = original.split(/\s+/);
                const inputDisplayWords = input.split(/\s+/);
                
                return originalDisplayWords.map((word, i) => {
                    const isCorrect = clean(word) === clean(inputWords[i] || '');
                    return { origWord: word, userWord: inputDisplayWords[i] || '____', isCorrect };
                });
            };

            if (currentView === 'list') {
                return (
                    <div className="min-h-screen p-6 md:p-12 fade-in">
                        <div className="max-w-5xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                                <div>
                                    <h1 className="text-4xl font-black text-slate-900 mb-2 tracking-tighter">Bible Interpreter</h1>
                                    <p className="text-slate-500 font-medium tracking-tight">통역사 훈련법 기반 영어 성경 마스터링</p>
                                </div>
                                <div className="bg-white px-6 py-4 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                                    <div className="bg-blue-100 p-2 rounded-lg"><BarChart3 className="text-blue-600 w-5 h-5" /></div>
                                    <div>
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Today's Progress</p>
                                        <p className="text-xl font-bold text-slate-800">{completedCount} <span className="text-sm font-medium text-slate-400">Verses</span></p>
                                    </div>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {BIBLE_DATA.map((item) => (
                                    <div key={item.id} onClick={() => { setSelectedItem(item); setCurrentView('study'); setStudyStep(1); setUserInput(''); setShowHint(false); }} className="bg-white p-7 rounded-3xl border border-slate-200 shadow-sm hover:shadow-2xl hover:border-blue-400 transition-all cursor-pointer group flex flex-col justify-between">
                                        <div>
                                            <div className="flex justify-between items-center mb-6">
                                                <span className="px-3 py-1 bg-slate-100 text-slate-600 text-[10px] font-black rounded-full uppercase tracking-tighter">Level {item.level}</span>
                                                <span className="text-[10px] font-black text-blue-500 uppercase">{item.theme}</span>
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-800 mb-3">{item.reference}</h3>
                                            <p className="text-slate-500 text-sm leading-relaxed line-clamp-3 font-medium italic">"{item.kor_natural}"</p>
                                        </div>
                                        <div className="mt-8 pt-6 border-t border-slate-50 flex justify-between items-center text-blue-600 text-xs font-black uppercase tracking-widest group-hover:translate-x-1 transition-transform inline-flex items-center">
                                            Start Training <ChevronRight className="w-4 h-4 ml-1" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (currentView === 'study') {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-0 md:p-8 font-sans fade-in">
                        <div className="max-w-4xl w-full bg-white md:rounded-[40px] shadow-2xl overflow-hidden min-h-[650px] flex flex-col">
                            <div className="bg-white border-b border-slate-100 p-6 flex justify-between items-center">
                                <button onClick={() => { window.speechSynthesis.cancel(); setCurrentView('list'); }} className="p-3 hover:bg-slate-50 rounded-2xl transition">
                                    <Home className="w-6 h-6 text-slate-400" />
                                </button>
                                <div className="flex gap-2">
                                    {[1, 2, 3].map(s => <div key={s} className={`h-1.5 w-12 rounded-full transition-all ${studyStep >= s ? 'bg-blue-600' : 'bg-slate-100'}`}></div>)}
                                </div>
                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{selectedItem.reference}</div>
                            </div>
                            <div className="p-8 md:p-14 flex-grow flex flex-col">
                                {studyStep === 1 && (
                                    <div className="space-y-10 flex-grow fade-in">
                                        <div className="space-y-4">
                                            <h2 className="text-3xl font-black text-slate-900 tracking-tight">Step 1. 의미 및 구조 파악</h2>
                                            <p className="text-slate-500 text-lg">원문의 소리와 영어식 어순 구조를 매칭하세요.</p>
                                        </div>
                                        <div className="space-y-6">
                                            <div className="bg-slate-900 p-8 rounded-[32px] shadow-xl relative group">
                                                <p className="text-[10px] font-black text-slate-500 mb-4 uppercase tracking-widest">Original Sentence</p>
                                                <p className="text-2xl md:text-3xl font-serif text-white italic leading-tight pr-16">"{selectedItem.eng_target}"</p>
                                                <button onClick={() => handleSpeak(selectedItem.eng_target)} className="absolute right-6 top-1/2 -translate-y-1/2 bg-blue-600 hover:bg-blue-500 text-white p-5 rounded-3xl shadow-xl transition-all active:scale-90"><Volume2 className="w-6 h-6" /></button>
                                            </div>
                                            <div className="bg-blue-50 p-8 rounded-[32px] border border-blue-100">
                                                <p className="text-[10px] font-black text-blue-500 mb-4 uppercase tracking-widest">Thinking Structure</p>
                                                <p className="text-xl md:text-2xl text-slate-800 font-bold leading-relaxed">{selectedItem.kor_structure}</p>
                                            </div>
                                        </div>
                                        <div className="bg-amber-50 p-6 rounded-2xl border border-amber-100 flex gap-4">
                                            <div className="bg-amber-200 p-2 rounded-xl h-fit"><Lightbulb className="w-5 h-5 text-amber-700" /></div>
                                            <div><p className="font-black text-amber-800 text-sm uppercase mb-1 tracking-tighter">Grammar Tip</p><p className="text-amber-700 text-sm leading-relaxed">{selectedItem.grammar_tip}</p></div>
                                        </div>
                                        <button onClick={() => setStudyStep(2)} className="mt-auto w-full bg-slate-900 text-white py-6 rounded-3xl font-black text-xl hover:bg-blue-600 transition-all shadow-xl active:scale-95 flex items-center justify-center gap-3">준비되었습니다! 영작 도전 <ChevronRight className="w-6 h-6" /></button>
                                    </div>
                                )}
                                {studyStep === 2 && (
                                    <div className="space-y-8 flex-grow fade-in">
                                        <div className="space-y-2">
                                            <h2 className="text-3xl font-black text-slate-900">Step 2. 역번역 영작</h2>
                                            <p className="text-slate-500 text-lg">아래의 구조만 보고 영어 문장을 타이핑하세요.</p>
                                        </div>
                                        <div className="bg-slate-100 p-8 rounded-[32px] border-2 border-dashed border-slate-300">
                                            <p className="text-[10px] font-black text-slate-400 mb-4 uppercase tracking-widest">Target Structure</p>
                                            <p className="text-xl md:text-2xl text-slate-800 font-bold leading-relaxed">{selectedItem.kor_structure}</p>
                                        </div>
                                        <div className="relative">
                                            <textarea autoFocus className="w-full h-48 p-8 border-2 border-slate-100 rounded-[32px] outline-none focus:border-blue-500 text-2xl font-serif leading-relaxed bg-slate-50 transition-all shadow-inner" placeholder="영어로 입력하세요..." value={userInput} onChange={(e) => setUserInput(e.target.value)} />
                                            <button onClick={() => setShowHint(!showHint)} className="absolute bottom-6 right-6 text-blue-600 font-bold text-xs uppercase tracking-widest hover:underline">{showHint ? "Hide Hint" : "Hint?"}</button>
                                        </div>
                                        {showHint && <div className="p-5 bg-blue-50 rounded-2xl border border-blue-100 animate-in"><p className="text-[10px] font-black text-blue-500 uppercase mb-1">First Words</p><p className="text-blue-800 font-bold italic">{selectedItem.eng_target.split(' ').slice(0, 3).join(' ')} ...</p></div>}
                                        <div className="flex gap-4 mt-auto pt-4">
                                            <button onClick={() => setStudyStep(1)} className="flex-1 py-5 text-slate-400 font-bold border-2 border-slate-100 rounded-3xl hover:bg-slate-50 transition-all">Back</button>
                                            <button onClick={() => setStudyStep(3)} disabled={!userInput.trim()} className="flex-[2] bg-blue-600 text-white py-5 rounded-3xl font-black text-xl hover:bg-blue-700 shadow-xl shadow-blue-100 disabled:opacity-30 transition-all active:scale-95">Check Accuracy</button>
                                        </div>
                                    </div>
                                )}
                                {studyStep === 3 && (
                                    <div className="space-y-10 flex-grow fade-in">
                                        <div className="space-y-2">
                                            <h2 className="text-3xl font-black text-slate-900">Step 3. 오류 분석</h2>
                                            <p className="text-slate-500 text-lg">원문과 본인의 답안을 단어별로 비교합니다.</p>
                                        </div>
                                        <div className="grid gap-6">
                                            <div className="bg-slate-900 p-8 rounded-[40px] shadow-2xl overflow-hidden relative">
                                                <div className="absolute top-0 left-0 w-2 h-full bg-red-500"></div>
                                                <p className="text-[10px] font-black text-slate-500 mb-6 uppercase tracking-widest">My Output</p>
                                                <div className="flex flex-wrap gap-x-4 gap-y-3 font-serif text-xl md:text-2xl leading-relaxed text-white">
                                                    {compareText(selectedItem.eng_target, userInput).map((res, i) => (
                                                        <div key={i} className="flex flex-col items-center">
                                                            <span className={res.isCorrect ? "opacity-90" : "text-red-500 font-black"}>{res.userWord}</span>
                                                            {!res.isCorrect && <span className="text-[10px] text-slate-400 font-sans uppercase mt-1">Correct: {res.origWord}</span>}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="bg-blue-50 p-8 rounded-[40px] relative group">
                                                <p className="text-[10px] font-black text-blue-500 mb-4 uppercase tracking-widest">Standard Target</p>
                                                <p className="text-2xl md:text-3xl font-serif text-slate-900 leading-snug italic font-medium pr-16">"{selectedItem.eng_target}"</p>
                                                <button onClick={() => handleSpeak(selectedItem.eng_target)} className="absolute right-8 top-1/2 -translate-y-1/2 bg-white text-blue-600 p-4 rounded-3xl shadow-lg hover:bg-blue-600 hover:text-white transition-all"><Volume2 className="w-5 h-5" /></button>
                                            </div>
                                        </div>
                                        <div className="flex gap-4 mt-auto">
                                            <button onClick={() => { setStudyStep(2); setUserInput(''); setShowHint(false); }} className="flex-1 py-5 text-blue-600 font-bold border-2 border-blue-50 rounded-3xl hover:bg-blue-50 transition-all flex items-center justify-center gap-2"><RefreshCcw className="w-5 h-5" /> Retry</button>
                                            <button onClick={() => { setCompletedCount(prev => prev + 1); setCurrentView('list'); }} className="flex-[2] bg-slate-900 text-white py-5 rounded-3xl font-black text-xl hover:bg-blue-600 transition-all shadow-xl active:scale-95">Finish</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
