<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Interpreter - 영어성경 통역 훈련</title>
    
    <!-- 엔진 부품: React, Babel, Tailwind CSS -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif:italic,wght@0,400;0,700;1,400&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
            word-break: keep-all; /* 모바일에서 단어가 어색하게 잘리지 않게 설정 */
        }
        
        .font-serif { font-family: 'Noto Serif', serif; }
        
        /* 부드러운 화면 전환 애니메이션 */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 로딩 중 안내 문구 스타일 */
        #root:empty::before {
            content: "하나님의 말씀을 불러오는 중입니다...";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #64748b;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /**
         * [학습 데이터 영역]
         * 새로운 성경 구절을 추가하고 싶다면, 아래 BIBLE_DATA 배열의 대괄호 [ ] 안에 
         * 중괄호 { } 형태의 데이터 덩어리를 추가하세요.
         */
        const BIBLE_DATA = [
            { id: 1, theme: "용기", reference: "Joshua 1:9", eng_target: "Have I not commanded you? Be strong and courageous.", kor_structure: "내가 너에게 명령하지 않았느냐? / 강하고 담대하라.", kor_natural: "내가 네게 명령한 것이 아니냐 강하고 담대하라.", grammar_tip: "Have I not ~?는 강한 강조를 나타내는 수사 의문문입니다.", words_hint: "command, courageous", level: 1 },
            { id: 2, theme: "위로", reference: "Matthew 11:28", eng_target: "Come to me, all you who are weary and burdened, and I will give you rest.", kor_structure: "나에게로 오라 / 너희 모든 수고하고 무거운 짐 진 자들아 / 그러면 내가 너희에게 안식을 주리라.", kor_natural: "수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라.", grammar_tip: "all you who ~는 '~하는 너희들 모두'라는 수식 구조입니다.", words_hint: "weary, burdened, rest", level: 2 },
            { id: 3, theme: "믿음", reference: "Hebrews 11:1", eng_target: "Now faith is confidence in what we hope for and assurance about what we do not see.", kor_structure: "이제 믿음은 확신이다 / 우리가 바라는 것들에 대한 / 그리고 확증이다 / 우리가 보지 못하는 것들에 대한.", kor_natural: "믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니.", grammar_tip: "what이 이끄는 관계대명사절 (~하는 것)이 핵심입니다.", words_hint: "confidence, assurance", level: 3 },
            { id: 4, theme: "사랑", reference: "1 Corinthians 13:4", eng_target: "Love is patient, love is kind. It does not envy, it does not boast, it is not proud.", kor_structure: "사랑은 오래 참고 / 사랑은 온유하며 / 시기하지 아니하며 / 자랑하지 아니하며 / 교만하지 아니한다.", kor_natural: "사랑은 언제나 오래 참고 사랑은 온유하며 시기하지 아니하며...", grammar_tip: "주어 + be동사 + 형용사 구조의 반복입니다.", words_hint: "patient, envy, boast", level: 2 },
            { id: 5, theme: "비전", reference: "Jeremiah 29:11", eng_target: "For I know the plans I have for you, declares the Lord, plans to prosper you and not to harm you.", kor_structure: "왜냐하면 내가 그 계획들을 알기 때문이다 / 내가 너희를 위해 가진 / 여호와께서 말씀하신다 / 너희를 번성하게 하려는 계획이요 / 재앙을 주려는 것이 아니다.", kor_natural: "여호와의 말씀이니라 너희를 향한 나의 생각을 내가 아나니 평안이요 재앙이 아니니라.", grammar_tip: "plans 뒤의 I have for you는 수식 구조입니다.", words_hint: "declare, prosper, harm", level: 3 },
            { id: 6, theme: "지혜", reference: "James 1:5", eng_target: "If any of you lacks wisdom, you should ask God, who gives generously to all.", kor_structure: "만약 너희 중 누구라도 지혜가 부족하다면 / 하나님께 구해야 한다 / 모든 사람에게 후히 주시는 (하나님께).", kor_natural: "너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고...", grammar_tip: "관계대명사 who의 계속적 용법이 쓰였습니다.", words_hint: "lack, wisdom, generously", level: 2 },
            { id: 7, theme: "합력", reference: "Romans 8:28", eng_target: "And we know that in all things God works for the good of those who love him.", kor_structure: "그리고 우리는 안다 / 모든 일 안에서 / 하나님이 선을 위해 일하신다는 것을 / 그를 사랑하는 자들을 위해.", kor_natural: "우리가 알거니와 하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라.", grammar_tip: "those who~는 '~하는 사람들'이라는 표현입니다.", words_hint: "work for good, those who", level: 3 },
            { id: 8, theme: "능력", reference: "Philippians 4:13", eng_target: "I can do all this through him who gives me strength.", kor_structure: "나는 이 모든 것을 할 수 있다 / 그분을 통해서 / 나에게 능력을 주시는.", kor_natural: "내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라.", grammar_tip: "who절이 '나에게 능력을 주는 그분'을 수식합니다.", words_hint: "through, strength", level: 1 },
            { id: 9, theme: "구원", reference: "John 3:16", eng_target: "For God so loved the world that he gave his one and only Son.", kor_structure: "왜냐하면 하나님이 세상을 이토록 사랑하셔서 / 그 결과 그분은 자신의 독생자를 주셨다.", kor_natural: "하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니...", grammar_tip: "so ~ that ... 구조는 '너무 ~해서 그 결과 ...하다'라는 뜻입니다.", words_hint: "one and only, Son", level: 2 }
            // --- 구절 추가 시작점: 여기에 10번 구절을 넣으시면 됩니다 ---
        ];

        // --- 아이콘 수동 정의 (아이콘 부품 로딩 오류 방지) ---
        const Icon = ({name}) => {
            const icons = {
                Home: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
                Speaker: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
                ChevronRight: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
                Refresh: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            };
            return icons[name] || <span>•</span>;
        };

        const App = () => {
            const [view, setView] = useState('list');
            const [selected, setSelected] = useState(null);
            const [step, setStep] = useState(1);
            const [input, setInput] = useState('');
            const [hint, setHint] = useState(false);
            const [doneCount, setDoneCount] = useState(0);

            // 읽어주기(TTS) 로직
            const speak = (txt) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'en-US';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            };

            // 채점 로직
            const compare = (orig, user) => {
                const clean = (s) => s ? s.replace(/[.,?!]/g, '').toLowerCase().trim() : '';
                const oWords = orig.split(/\s+/);
                const uWords = clean(user).split(/\s+/);
                return oWords.map((w, i) => ({
                    orig: w,
                    user: user.split(/\s+/)[i] || '____',
                    ok: clean(w) === uWords[i]
                }));
            };

            // --- 1. 리스트 화면 ---
            if (view === 'list') {
                return (
                    <div className="min-h-screen p-5 md:p-12 fade-in">
                        <div className="max-w-5xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-center md:items-end mb-10 border-b pb-8 border-slate-200 gap-6">
                                <div className="text-center md:text-left">
                                    <h1 className="text-3xl md:text-4xl font-black text-slate-900 tracking-tighter italic">Bible Translation Coach</h1>
                                    <p className="text-slate-500 font-medium mt-2">통역사 훈련법으로 체득하는 9가지 성경 말씀</p>
                                </div>
                                <div className="bg-white px-8 py-3 rounded-2xl shadow-sm border border-slate-200 text-center min-w-[120px]">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Progress</p>
                                    <p className="text-2xl font-black text-blue-600">{doneCount} / {BIBLE_DATA.length}</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                {BIBLE_DATA.map((item) => (
                                    <div key={item.id} onClick={() => { setSelected(item); setView('study'); setStep(1); setInput(''); setHint(false); }} className="bg-white p-7 rounded-[32px] border border-slate-200 shadow-sm hover:shadow-xl hover:border-blue-400 hover:-translate-y-1 transition-all cursor-pointer group flex flex-col justify-between h-64">
                                        <div>
                                            <div className="flex justify-between items-center mb-6 text-[10px] font-bold uppercase tracking-widest">
                                                <span className="text-slate-400">Level {item.level}</span>
                                                <span className="text-blue-500 font-black">{item.theme}</span>
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-800 mb-2 group-hover:text-blue-600 transition-colors">{item.reference}</h3>
                                            <p className="text-slate-500 text-sm leading-relaxed line-clamp-2 italic">"{item.kor_natural}"</p>
                                        </div>
                                        <div className="mt-6 pt-4 border-t border-slate-50 flex justify-between items-center text-blue-600 text-xs font-black uppercase tracking-widest">
                                            Start Training <Icon name="ChevronRight" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // --- 2. 학습 단계별 화면 ---
            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-0 md:p-8 font-sans fade-in">
                    <div className="max-w-4xl w-full bg-white md:rounded-[48px] shadow-2xl overflow-hidden min-h-[650px] flex flex-col">
                        <div className="bg-white border-b border-slate-100 p-5 md:p-6 flex justify-between items-center">
                            <button onClick={() => { window.speechSynthesis.cancel(); setView('list'); }} className="p-3 hover:bg-slate-50 rounded-2xl transition active:scale-90"><Icon name="Home" /></button>
                            <div className="flex gap-2">
                                {[1, 2, 3].map(s => <div key={s} className={`h-1.5 w-10 md:w-16 rounded-full transition-all ${step >= s ? 'bg-blue-600' : 'bg-slate-100'}`}></div>)}
                            </div>
                            <div className="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest">{selected.reference}</div>
                        </div>
                        <div className="p-6 md:p-14 flex-grow flex flex-col">
                            {step === 1 && (
                                <div className="space-y-8 md:space-y-10 flex-grow fade-in flex flex-col justify-center">
                                    <div className="space-y-3 text-center">
                                        <h2 className="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">Step 1. 의미 및 소리 익히기</h2>
                                        <p className="text-slate-500 text-sm md:text-lg">원문을 들으며 영어식 어순을 머릿속에 그리세요.</p>
                                    </div>
                                    <div className="space-y-6">
                                        <div className="bg-slate-900 p-8 md:p-10 rounded-[40px] shadow-xl relative group">
                                            <p className="text-[10px] font-black text-slate-500 mb-4 uppercase tracking-widest text-center">Standard English</p>
                                            <p className="text-xl md:text-3xl font-serif text-white italic leading-tight text-center px-4 md:px-12">"{selected.eng_target}"</p>
                                            <button onClick={() => speak(selected.eng_target)} className="mt-8 mx-auto flex items-center justify-center bg-blue-600 text-white w-14 h-14 md:w-16 md:h-16 rounded-full hover:bg-blue-500 transition-all shadow-xl active:scale-95"><Icon name="Speaker" /></button>
                                        </div>
                                        <div className="bg-blue-50 p-8 md:p-10 rounded-[40px] border border-blue-100">
                                            <p className="text-lg md:text-2xl text-slate-800 font-bold leading-relaxed text-center">{selected.kor_structure}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setStep(2)} className="mt-auto w-full bg-slate-900 text-white py-6 md:py-8 rounded-[28px] font-black text-lg md:text-xl hover:bg-blue-600 shadow-2xl transition-all flex items-center justify-center gap-3">영작 훈련 시작하기 <Icon name="ChevronRight" /></button>
                                </div>
                            )}
                            {step === 2 && (
                                <div className="space-y-8 flex-grow fade-in">
                                    <div className="space-y-2"><h2 className="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">Step 2. 역번역 영작</h2></div>
                                    <div className="bg-slate-100 p-8 md:p-10 rounded-[32px] border-2 border-dashed border-slate-300">
                                        <p className="text-lg md:text-2xl text-slate-800 font-bold leading-relaxed text-center italic">"{selected.kor_structure}"</p>
                                    </div>
                                    <div className="relative">
                                        <textarea autoFocus className="w-full h-48 md:h-56 p-8 md:p-10 border-2 border-slate-100 rounded-[32px] md:rounded-[40px] outline-none focus:border-blue-500 text-xl md:text-2xl font-serif bg-slate-50 shadow-inner" placeholder="영어로 입력하세요..." value={input} onChange={(e) => setInput(e.target.value)} />
                                        <button onClick={() => setHint(!hint)} className="absolute bottom-6 right-6 md:bottom-10 md:right-10 text-blue-600 font-bold text-[10px] md:text-xs uppercase tracking-widest hover:underline">{hint ? "Hide Hint" : "Hint?"}</button>
                                    </div>
                                    {hint && <div className="p-6 md:p-8 bg-amber-50 rounded-[32px] animate-in text-amber-800 font-bold italic text-lg md:text-xl">{selected.eng_target.split(' ').slice(0, 3).join(' ')} ...</div>}
                                    <div className="flex gap-4 mt-auto pt-4">
                                        <button onClick={() => setStep(1)} className="flex-1 py-6 text-slate-400 font-black border-2 border-slate-100 rounded-[28px] hover:bg-slate-50 transition-all">Back</button>
                                        <button onClick={() => setStep(3)} disabled={!input.trim()} className="flex-[2] bg-blue-600 text-white py-6 rounded-[28px] font-black text-lg md:text-xl shadow-xl disabled:opacity-30 active:scale-95">Check Accuracy</button>
                                    </div>
                                </div>
                            )}
                            {step === 3 && (
                                <div className="space-y-10 flex-grow fade-in">
                                    <div className="space-y-2"><h2 className="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">Step 3. 분석 및 복습</h2></div>
                                    <div className="grid gap-6 md:gap-8">
                                        <div className="bg-slate-900 p-8 md:p-10 rounded-[40px] shadow-2xl relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-2 h-full bg-red-500"></div>
                                            <p className="text-[10px] font-black text-slate-500 mb-6 uppercase tracking-widest">My Output</p>
                                            <div className="flex flex-wrap gap-x-4 md:gap-x-6 gap-y-4 font-serif text-xl md:text-2xl text-white leading-relaxed">
                                                {compare(selected.eng_target, input).map((res, i) => (
                                                    <div key={i} className="flex flex-col items-center">
                                                        <span className={res.ok ? "opacity-90" : "text-red-500 font-black underline underline-offset-4 md:underline-offset-8"}>{res.user}</span>
                                                        {!res.ok && <span className="text-[10px] text-slate-500 uppercase mt-2">Ref: {res.orig}</span>}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="bg-blue-50 p-8 md:p-10 rounded-[40px] relative group border border-blue-100">
                                            <p className="text-[10px] font-black text-blue-500 mb-4 uppercase tracking-widest">Standard Model</p>
                                            <p className="text-xl md:text-2xl font-serif text-slate-900 leading-snug italic font-medium text-center md:text-left pr-0 md:pr-16">"{selected.eng_target}"</p>
                                            <button onClick={() => speak(selected.eng_target)} className="mt-6 md:mt-0 md:absolute md:right-8 md:top-1/2 md:-translate-y-1/2 mx-auto flex items-center justify-center bg-white text-blue-600 w-12 h-14 md:p-6 rounded-3xl shadow-lg hover:bg-blue-600 hover:text-white transition-all"><Icon name="Speaker" /></button>
                                        </div>
                                    </div>
                                    <div className="flex gap-4 mt-auto pt-4">
                                        <button onClick={() => { setStep(2); setInput(''); setHint(false); }} className="flex-1 py-6 text-blue-600 font-black border-2 border-blue-100 rounded-[28px] flex items-center justify-center gap-2 hover:bg-blue-50 transition-all"><Icon name="Refresh" /> Retry</button>
                                        <button onClick={() => { setDoneCount(d => d + 1); setView('list'); }} className="flex-[2] bg-slate-900 text-white py-6 rounded-[28px] font-black text-lg md:text-xl shadow-xl transition-all">Finish Training</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 앱 렌더링 시도
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
